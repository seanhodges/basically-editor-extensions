name: Release extensions

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-extensions-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Publish clients
    runs-on: ubuntu-latest

    # Lifted to the job so the publish steps can test for them in their own
    # `if`: a secret set in a step's `env` is not yet visible to that step's
    # condition, which is how a guard like this silently never fires.
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Fetch the language server
        run: node scripts/fetch-server.mjs

      - name: Test
        run: npm test

      - name: Package clients
        run: npm run package

      # Publishing is skipped rather than failed where the token is not
      # configured, so a repository without one still cuts a GitHub Release.
      - name: Publish to the VS Code Marketplace
        if: env.VSCE_PAT != ''
        run: npx --yes @vscode/vsce publish --packagePath dist/basically-vscode.vsix

      - name: Publish to Open VSX
        if: env.OVSX_PAT != ''
        run: npx --yes ovsx publish dist/basically-vscode.vsix --pat "$OVSX_PAT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: dist/*.vsix
