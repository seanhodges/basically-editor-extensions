name: Build extensions

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: build-extensions-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & package clients
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The language server is a Node program, and the version it is pinned to
      # is the one the toolchain declares an engine for.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      # Not committed, and not a binary: `npm pack` of the pinned version of
      # @ba.sical.ly/cli, unpacked into the client.
      - name: Fetch the language server
        run: node scripts/fetch-server.mjs

      # Drives a real LSP conversation with the server just fetched. This is
      # the step that fails if the client and the server have parted company.
      - name: Test
        run: npm test

      - name: Package clients
        run: npm run package

      - name: Upload packaged extensions
        uses: actions/upload-artifact@v4
        with:
          name: extensions
          path: dist/*.vsix
          if-no-files-found: error
          retention-days: 14
